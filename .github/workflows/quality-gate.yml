name: Clover quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - staging

concurrency:
  group: clover-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix mobile

      - name: Generate Prisma Client
        run: npm --prefix web exec -- prisma generate --schema web/prisma/schema.prisma

      - name: Reject high-risk production dependency advisories
        run: |
          npm --prefix web run qa:production-audit
          npm --prefix mobile audit --omit=dev --audit-level=high

      - name: Run the same pre-push quality gate used locally
        run: npm run qa:prepush
