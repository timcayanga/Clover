name: Clover quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - staging

concurrency:
  group: clover-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Generate Prisma Client
        run: npm --prefix web exec -- prisma generate --schema web/prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Run release regressions
        run: npm run qa:release

      - name: Build production application
        run: npm run build

      - name: Reject critical dependency advisories
        run: npm audit --prefix web --omit=dev --audit-level=high
