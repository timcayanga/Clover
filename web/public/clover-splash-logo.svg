<svg width="124" height="124" viewBox="0 0 124 124" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .leaf {
    transform-box: fill-box;
    transform-origin: center;
    animation: clover-leaf-bloom 2.8s cubic-bezier(0.42, 0, 0.18, 1) infinite;
  }

  .leaf-2 { animation-delay: 0.18s; }
  .leaf-3 { animation-delay: 0.36s; }
  .leaf-4 { animation-delay: 0.54s; }

  @keyframes clover-leaf-bloom {
    0%, 72%, 100% {
      opacity: 0.74;
      transform: scale(0.94) rotate(0deg);
      filter: saturate(0.95);
    }

    18% {
      opacity: 1;
      transform: scale(1.04) rotate(var(--leaf-tilt, 4deg));
      filter: saturate(1.16);
    }

    36% {
      opacity: 0.9;
      transform: scale(0.98) rotate(0deg);
      filter: saturate(1.02);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .leaf {
      animation: none;
    }
  }
</style>
